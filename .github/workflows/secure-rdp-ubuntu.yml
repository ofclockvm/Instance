name: Tailscale (Automated Loop)

on:
  workflow_dispatch:
  schedule:
    # كل 6 ساعات (00:00، 06:00، 12:00، 18:00 UTC)
    - cron: '0 */6 * * *'

concurrency:
  group: secure-rdp-ubuntu
  cancel-in-progress: true

jobs:
  secure-rdp-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
      NEEDRESTART_SUSPEND: 1
      TS_HOSTNAME: secure-rdp-ubuntu
      RDP_USER: rdpuser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "::error::TS_AUTHKEY secret is not set"
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="$TS_HOSTNAME" \
            --accept-routes \
            --ephemeral

          sudo tailscale set --operator=$USER
          tailscale status
          tailscale ip -4

      - name: Install minimal desktop and xrdp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xfce4 xfce4-goodies xrdp xorgxrdp dbus-x11
          sudo apt-get clean

      - name: Create RDP user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "::error::RDP_PASSWORD secret is not set"
            exit 1
          fi

          if ! id -u "$RDP_USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd

          echo "exec xfce4-session" | sudo tee /home/$RDP_USER/.xsession > /dev/null
          sudo chown $RDP_USER:$RDP_USER /home/$RDP_USER/.xsession
          sudo adduser $RDP_USER ssl-cert || true

      - name: Configure xrdp for XFCE
        run: |
          sudo printf '%s\n' \
            '#!/bin/sh' \
            'if [ -r /etc/default/locale ]; then' \
            '  . /etc/default/locale' \
            '  export LANG LANGUAGE' \
            'fi' \
            'exec xfce4-session' \
            | sudo tee /etc/xrdp/startwm.sh > /dev/null

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Enable and start xrdp
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sudo systemctl status xrdp --no-pager

      - name: Show connection info
        run: |
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "RDP user: $RDP_USER"
          echo "RDP port: 3389"
          echo "Connect via: <Tailscale-IP>:3389"

      - name: Keep runner alive
        run: |
          echo "Runner will stay alive for ~5h55m. Press cancel to stop."
          sleep 21300
