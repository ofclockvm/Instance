name: Ubuntu Desktop RDP via Tailscale
on:
  workflow_dispatch:

jobs:
  ubuntu-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --hostname=gh-runner-ubuntu-${{ github.run_number }} --accept-routes

      - name: Install Ubuntu Desktop and xrdp
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          # تعيين كلمة مرور للمستخدم
          echo "runner:ubuntu123" | sudo chpasswd
          # التأكد من أن xrdp يستمع على المنفذ 3389
          sudo netstat -tlnp | grep 3389

      - name: Get Tailscale IP and Show Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo "========================================================"
          echo "🖥️  Ubuntu RDP Connection Details"
          echo "========================================================"
          echo "Address: $TS_IP"
          echo "Username: runner"
          echo "Password: ubuntu123"
          echo "Port: 3389"
          echo "========================================================"

      - name: Keep Session Alive
        run: sleep 21600  # 6 hours
